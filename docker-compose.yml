# Quizopia — ONE authoritative Compose stack for local development and demos.
#
#   Core (frontend/backend/postgres/redis/minio/mailpit):
#     docker compose up -d --build
#   + LiveKit camera monitoring:
#     docker compose --profile monitoring up -d --build
#   + monitoring AND recording (egress):
#     docker compose --profile monitoring --profile recording up -d --build
#
# Helper scripts: scripts/start-demo.ps1 | stop-demo.ps1 | status-demo.ps1
#
# `name:` is pinned so volume identity is independent of the checkout
# directory: quizopia-system_postgres_data / _redis_data / _minio_data.
# NEVER run `docker compose down -v` here — it deletes persistent data.
name: quizopia-system

services:
  postgres-db:
    image: postgres:17
    container_name: quizopia_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: quizopia_db
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - quizopia_network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U quiz_user -d quizopia_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7.2-alpine
    container_name: quizopia_redis
    restart: unless-stopped

    command: redis-server --requirepass redis_password

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - quizopia_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizopia_backend
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/quizopia_db
      SPRING_DATASOURCE_USERNAME: quiz_user
      SPRING_DATASOURCE_PASSWORD: quiz_password
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
      # Quizopia security secrets. Provide real values via a local .env file
      # (see .env.example). Empty values make the backend fail fast on start.
      QUIZOPIA_JWT_SECRET_BASE64: ${QUIZOPIA_JWT_SECRET_BASE64:-}
      QUIZOPIA_DATA_ENCRYPTION_KEY_BASE64: ${QUIZOPIA_DATA_ENCRYPTION_KEY_BASE64:-}
      # Teacher invite code was removed in Identity M1; do not forward it.
      QUIZOPIA_ALLOWED_ORIGINS: ${QUIZOPIA_ALLOWED_ORIGINS:-http://localhost:3000}
      QUIZOPIA_COOKIE_SECURE: ${QUIZOPIA_COOKIE_SECURE:-false}
      QUIZOPIA_DEMO_DATA_ENABLED: ${QUIZOPIA_DEMO_DATA_ENABLED:-false}
      # Identity M1/M5: forward settings from the System root .env.
      # Backend connects to the Mailpit SERVICE, never localhost inside Docker.
      QUIZOPIA_SMTP_HOST: ${QUIZOPIA_SMTP_HOST:-mailpit}
      QUIZOPIA_SMTP_PORT: ${QUIZOPIA_SMTP_PORT:-1025}
      QUIZOPIA_MAIL_FROM: ${QUIZOPIA_MAIL_FROM:-Quizopia <no-reply@quizopia.local>}
      QUIZOPIA_PASSWORD_RESET_FRONTEND_BASE_URI: ${QUIZOPIA_PASSWORD_RESET_FRONTEND_BASE_URI:-http://localhost:3000}
      QUIZOPIA_GOOGLE_CLIENT_ID: ${QUIZOPIA_GOOGLE_CLIENT_ID:-}
      QUIZOPIA_GOOGLE_CLIENT_SECRET: ${QUIZOPIA_GOOGLE_CLIENT_SECRET:-}
      QUIZOPIA_OAUTH_FRONTEND_REDIRECT_URL: ${QUIZOPIA_OAUTH_FRONTEND_REDIRECT_URL:-http://localhost:3000/auth/callback}
      QUIZOPIA_OAUTH_REDIRECT_BASE_URI: ${QUIZOPIA_OAUTH_REDIRECT_BASE_URI:-http://localhost:8080}
      # P4 monitoring / LiveKit / evidence (feature flags remain OFF by default).
      # RoomService (server->SFU) uses the Docker service DNS name; the
      # browser-facing WS URL must stay a host-reachable address (localhost).
      QUIZOPIA_AI_INGEST_KEY: ${QUIZOPIA_AI_INGEST_KEY:-}
      QUIZOPIA_LIVEKIT_ENABLED: ${QUIZOPIA_LIVEKIT_ENABLED:-false}
      QUIZOPIA_LIVEKIT_API_KEY: ${QUIZOPIA_LIVEKIT_API_KEY:-devquizopia}
      QUIZOPIA_LIVEKIT_API_SECRET: ${QUIZOPIA_LIVEKIT_API_SECRET:-}
      QUIZOPIA_LIVEKIT_HTTP_URL: ${QUIZOPIA_LIVEKIT_HTTP_URL:-http://livekit:7880}
      QUIZOPIA_LIVEKIT_WS_URL: ${QUIZOPIA_LIVEKIT_WS_URL:-ws://localhost:7880}
      QUIZOPIA_EVIDENCE_MINIO_ENDPOINT: ${QUIZOPIA_EVIDENCE_MINIO_ENDPOINT:-http://minio:9000}
      # S3 endpoint handed to the EGRESS CONTAINER inside recording requests
      # (same network -> service DNS name, not host.docker.internal).
      QUIZOPIA_EVIDENCE_MINIO_EGRESS_ENDPOINT: ${QUIZOPIA_EVIDENCE_MINIO_EGRESS_ENDPOINT:-http://minio:9000}
      # Browser-reachable base for presigned playback URLs (teacher video):
      # host-published MinIO port, never the Docker-internal hostname.
      QUIZOPIA_EVIDENCE_MINIO_PUBLIC_ENDPOINT: ${QUIZOPIA_EVIDENCE_MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      QUIZOPIA_EVIDENCE_MINIO_ACCESS_KEY: ${QUIZOPIA_EVIDENCE_MINIO_ACCESS_KEY:-}
      QUIZOPIA_EVIDENCE_MINIO_SECRET_KEY: ${QUIZOPIA_EVIDENCE_MINIO_SECRET_KEY:-}
      QUIZOPIA_EVIDENCE_BUCKET: ${QUIZOPIA_EVIDENCE_BUCKET:-quizopia-evidence}
      QUIZOPIA_FFMPEG_COMMAND: ${QUIZOPIA_FFMPEG_COMMAND:-ffmpeg}
      # P5 AI Authoring (OpenAI; endpoints implemented separately in Phase 5).
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

    ports:
      - "8080:8080"

    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      minio:
        condition: service_healthy

    networks:
      - quizopia_network
    # Kept for host-run tooling / E2E workflows that address the host from
    # containers (LiveKit itself now lives in this stack, service DNS "livekit").
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* phải được inject LÚC BUILD để Next.js inline vào client bundle.
        # Phải là URL browser-reachable (localhost:8080), KHÔNG phải hostname nội bộ Docker.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: quizopia_frontend
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}

    ports:
      - "3000:3000"

    depends_on:
      - backend

    networks:
      - quizopia_network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: quizopia_minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      # Root credentials double as the dev evidence-bucket credentials in
      # .env (QUIZOPIA_EVIDENCE_MINIO_*). Keeping them in .env preserves the
      # credentials of an EXISTING minio_data volume across recreations.
      MINIO_ROOT_USER: ${QUIZOPIA_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${QUIZOPIA_MINIO_ROOT_PASSWORD:-minioadmin123}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - quizopia_network
    healthcheck:
      test: [ "CMD-SHELL", "mc ready local" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: quizopia_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

    networks:
      - quizopia_network

  # ------------------------------------------------------------------
  # Camera monitoring profile (Phase 4). Start with --profile monitoring.
  # Replaces the former standalone docker-compose.livekit.yml stack.
  # ------------------------------------------------------------------
  livekit-redis:
    image: redis:7-alpine
    container_name: quizopia_livekit_redis
    restart: unless-stopped
    # Also in the "recording" profile: recording requires the SFU + its
    # redis, so `--profile recording` alone activates them too.
    profiles: ["monitoring", "recording"]
    # Orchestration-only store (room state, not application data); in-memory
    # on purpose. Kept SEPARATE from the application redis-cache.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - quizopia_network

  livekit:
    image: livekit/livekit-server:v1.9
    container_name: quizopia_livekit
    restart: unless-stopped
    profiles: ["monitoring", "recording"]
    # livekit-server does NOT expand ${...} in its YAML config; render the
    # infra/livekit/livekit.yaml template with the process env at launch.
    # The secret never enters the command line (env + container-local /tmp).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        test -n "$$LIVEKIT_API_SECRET" || { echo 'ERROR: QUIZOPIA_LIVEKIT_API_SECRET is empty. Set it in the System root .env (see .env.example) before starting the monitoring profile.'; exit 1; }
        sed -e "s|\$${LIVEKIT_API_KEY}|$$LIVEKIT_API_KEY|" \
            -e "s|\$${LIVEKIT_API_SECRET}|$$LIVEKIT_API_SECRET|" \
            -e "s|\$${LIVEKIT_WEBHOOK_URL}|$$LIVEKIT_WEBHOOK_URL|" \
            -e "s|\$${LIVEKIT_RTC_NODE_IP}|$$LIVEKIT_RTC_NODE_IP|" \
            -e "s|\$${LIVEKIT_RTC_PORT_START}|$$LIVEKIT_RTC_PORT_START|" \
            -e "s|\$${LIVEKIT_RTC_PORT_END}|$$LIVEKIT_RTC_PORT_END|" \
            /etc/livekit/livekit.yaml > /tmp/livekit.yaml
        exec /livekit-server --config /tmp/livekit.yaml
    ports:
      - "7880:7880" # HTTP/WSS signaling (browsers + Twirp RoomService)
      - "7881:7881" # WebRTC over TCP fallback
      - "3478:3478/udp" # embedded TURN (UDP)
      # WebRTC ICE/UDP media range (rtc.port_range). Config + published ports
      # move together via LIVEKIT_RTC_PORT_START/END — needed on Windows when
      # Hyper-V dynamic exclusions cover the default range.
      - "${LIVEKIT_RTC_PORT_START:-50100}-${LIVEKIT_RTC_PORT_END:-50200}:${LIVEKIT_RTC_PORT_START:-50100}-${LIVEKIT_RTC_PORT_END:-50200}/udp"
    environment:
      # Same credential pair the backend uses (QUIZOPIA_LIVEKIT_API_KEY /
      # _API_SECRET in the root .env) — key/secret must match the backend.
      LIVEKIT_API_KEY: ${QUIZOPIA_LIVEKIT_API_KEY:-devquizopia}
      LIVEKIT_API_SECRET: ${QUIZOPIA_LIVEKIT_API_SECRET:-}
      # Signed webhook target: backend service inside this network by
      # default; use http://host.docker.internal:8080/... when the backend
      # runs directly on the host (E2E workflows).
      LIVEKIT_WEBHOOK_URL: ${LIVEKIT_WEBHOOK_URL:-http://backend:8080/internal/media/v1/livekit/webhooks}
      # ICE candidates advertise loopback for browsers on the Docker host;
      # set the host LAN IP here for LAN demos (README "LAN demo").
      LIVEKIT_RTC_NODE_IP: ${LIVEKIT_RTC_NODE_IP:-127.0.0.1}
      LIVEKIT_RTC_PORT_START: ${LIVEKIT_RTC_PORT_START:-50100}
      LIVEKIT_RTC_PORT_END: ${LIVEKIT_RTC_PORT_END:-50200}
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    depends_on:
      livekit-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - quizopia_network

  # ------------------------------------------------------------------
  # Recording profile (Phase 4 P4-D). Start with
  # --profile monitoring --profile recording.
  # Storage destination arrives per request from the backend (MinIO/S3);
  # this service only needs LiveKit credentials + redis + SFU connectivity.
  # ------------------------------------------------------------------
  egress:
    image: livekit/egress:v1.9
    container_name: quizopia_livekit_egress
    restart: unless-stopped
    profiles: ["recording"]
    # Like the SFU above: egress does NOT expand ${...} in its YAML config,
    # so render the template with the process env at launch.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        test -n "$$LK_API_SECRET" || { echo 'ERROR: QUIZOPIA_LIVEKIT_API_SECRET is empty. Set it in the System root .env (see .env.example) before starting the recording profile.'; exit 1; }
        sed -e "s|\$${LIVEKIT_API_KEY}|$$LK_API_KEY|" \
            -e "s|\$${LIVEKIT_API_SECRET}|$$LK_API_SECRET|" \
            /etc/livekit/egress.yaml > /tmp/egress.yaml
        exec /usr/bin/egress --config /tmp/egress.yaml
    environment:
      # Egress reads the same API key/secret pair as the SFU and backend.
      LK_API_KEY: ${QUIZOPIA_LIVEKIT_API_KEY:-devquizopia}
      LK_API_SECRET: ${QUIZOPIA_LIVEKIT_API_SECRET:-}
      E_CONFIG_FILE: /tmp/egress.yaml
    volumes:
      - ./infra/livekit/egress.yaml:/etc/livekit/egress.yaml:ro
    depends_on:
      livekit-redis:
        condition: service_healthy
      livekit:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - quizopia_network

  backend-test:
    image: maven:3.9-eclipse-temurin-21
    profiles:
      - test

    working_dir: /workspace/backend

    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal

    volumes:
      - ./backend:/workspace/backend
      - maven_cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - mvn
      - test

    networks:
      - quizopia_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  maven_cache:

networks:
  quizopia_network:
    driver: bridge
