services:
  postgres-db:
    image: postgres:17
    container_name: quizopia_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: quizopia_db
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - quizopia_network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U quiz_user -d quizopia_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7.2-alpine
    container_name: quizopia_redis
    restart: unless-stopped

    command: redis-server --requirepass redis_password

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - quizopia_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizopia_backend
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/quizopia_db
      SPRING_DATASOURCE_USERNAME: quiz_user
      SPRING_DATASOURCE_PASSWORD: quiz_password
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
      # Quizopia security secrets. Provide real values via a local .env file
      # (see .env.example). Empty values make the backend fail fast on start.
      QUIZOPIA_JWT_SECRET_BASE64: ${QUIZOPIA_JWT_SECRET_BASE64:-}
      QUIZOPIA_DATA_ENCRYPTION_KEY_BASE64: ${QUIZOPIA_DATA_ENCRYPTION_KEY_BASE64:-}
      # Teacher invite code was removed in Identity M1; do not forward it.
      QUIZOPIA_ALLOWED_ORIGINS: ${QUIZOPIA_ALLOWED_ORIGINS:-http://localhost:3000}
      QUIZOPIA_COOKIE_SECURE: ${QUIZOPIA_COOKIE_SECURE:-false}
      QUIZOPIA_DEMO_DATA_ENABLED: ${QUIZOPIA_DEMO_DATA_ENABLED:-false}
      # Identity M1/M5: forward settings from the System root .env.
      # Backend connects to the Mailpit SERVICE, never localhost inside Docker.
      QUIZOPIA_SMTP_HOST: ${QUIZOPIA_SMTP_HOST:-mailpit}
      QUIZOPIA_SMTP_PORT: ${QUIZOPIA_SMTP_PORT:-1025}
      QUIZOPIA_MAIL_FROM: ${QUIZOPIA_MAIL_FROM:-Quizopia <no-reply@quizopia.local>}
      QUIZOPIA_PASSWORD_RESET_FRONTEND_BASE_URI: ${QUIZOPIA_PASSWORD_RESET_FRONTEND_BASE_URI:-http://localhost:3000}
      QUIZOPIA_GOOGLE_CLIENT_ID: ${QUIZOPIA_GOOGLE_CLIENT_ID:-}
      QUIZOPIA_GOOGLE_CLIENT_SECRET: ${QUIZOPIA_GOOGLE_CLIENT_SECRET:-}
      QUIZOPIA_OAUTH_FRONTEND_REDIRECT_URL: ${QUIZOPIA_OAUTH_FRONTEND_REDIRECT_URL:-http://localhost:3000/auth/callback}
      QUIZOPIA_OAUTH_REDIRECT_BASE_URI: ${QUIZOPIA_OAUTH_REDIRECT_BASE_URI:-http://localhost:8080}
      # P4 monitoring / LiveKit / evidence (feature flags remain OFF by default).
      QUIZOPIA_AI_INGEST_KEY: ${QUIZOPIA_AI_INGEST_KEY:-}
      QUIZOPIA_LIVEKIT_ENABLED: ${QUIZOPIA_LIVEKIT_ENABLED:-false}
      QUIZOPIA_LIVEKIT_API_KEY: ${QUIZOPIA_LIVEKIT_API_KEY:-devquizopia}
      QUIZOPIA_LIVEKIT_API_SECRET: ${QUIZOPIA_LIVEKIT_API_SECRET:-}
      QUIZOPIA_LIVEKIT_HTTP_URL: ${QUIZOPIA_LIVEKIT_HTTP_URL:-http://host.docker.internal:7880}
      QUIZOPIA_LIVEKIT_WS_URL: ${QUIZOPIA_LIVEKIT_WS_URL:-ws://localhost:7880}
      QUIZOPIA_EVIDENCE_MINIO_ENDPOINT: ${QUIZOPIA_EVIDENCE_MINIO_ENDPOINT:-http://minio:9000}
      QUIZOPIA_EVIDENCE_MINIO_EGRESS_ENDPOINT: ${QUIZOPIA_EVIDENCE_MINIO_EGRESS_ENDPOINT:-http://host.docker.internal:9000}
      QUIZOPIA_EVIDENCE_MINIO_ACCESS_KEY: ${QUIZOPIA_EVIDENCE_MINIO_ACCESS_KEY:-}
      QUIZOPIA_EVIDENCE_MINIO_SECRET_KEY: ${QUIZOPIA_EVIDENCE_MINIO_SECRET_KEY:-}
      QUIZOPIA_EVIDENCE_BUCKET: ${QUIZOPIA_EVIDENCE_BUCKET:-quizopia-evidence}
      QUIZOPIA_FFMPEG_COMMAND: ${QUIZOPIA_FFMPEG_COMMAND:-ffmpeg}
      # P5 AI Authoring (OpenAI; endpoints implemented separately in Phase 5).
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

    ports:
      - "8080:8080"

    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started

    networks:
      - quizopia_network
    # For P4 LiveKit when it is running on the Docker host / separate stack.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* phải được inject LÚC BUILD để Next.js inline vào client bundle.
        # Phải là URL browser-reachable (localhost:8080), KHÔNG phải hostname nội bộ Docker.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: quizopia_frontend
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}

    ports:
      - "3000:3000"

    depends_on:
      - backend

    networks:
      - quizopia_network

  minio:
    image: minio/minio:latest
    container_name: quizopia_minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - quizopia_network

    healthcheck:
      test: [ "CMD-SHELL", "mc ready local" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: quizopia_mailpit
    restart: unless-stopped

    ports:
      - "8025:8025"
      - "1025:1025"

    networks:
      - quizopia_network

  backend-test:
    image: maven:3.9-eclipse-temurin-21
    profiles:
      - test

    working_dir: /workspace/backend

    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal

    volumes:
      - ./backend:/workspace/backend
      - maven_cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - mvn
      - test

    networks:
      - quizopia_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  maven_cache:

networks:
  quizopia_network:
    driver: bridge
