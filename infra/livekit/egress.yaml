# LiveKit Egress (P4-D, recording/clips) — started with `--profile recording`.
#
# The root docker-compose.yml renders the ${...} placeholders below into a
# container-local /tmp/egress.yaml at launch (the egress binary does NOT
# expand env vars in its config itself). Recording storage is NOT configured
# here on purpose: the Quizopia backend passes the MinIO/S3 destination
# (endpoint + credentials + bucket) per recording request
# (TwirpEgressGateway, quizopia.media.storage.egress-endpoint).

redis:
  address: livekit-redis:6379

api_key: ${LIVEKIT_API_KEY}
api_secret: ${LIVEKIT_API_SECRET}

# ws_url points at the SFU inside the compose network.
ws_url: ws://livekit:7880

# Evidence objects land in the PRIVATE bucket configured for the backend
# (QUIZOPIA_EVIDENCE_BUCKET, default quizopia-evidence) under
# monitoring/{recordings,clips,snapshots,rolling-temp} prefixes; access is
# authorized server-side (presigned, teacher-scoped URLs only).

log_level: info
